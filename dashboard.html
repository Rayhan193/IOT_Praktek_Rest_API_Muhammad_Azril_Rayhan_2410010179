<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Dashboard - REST API & WebSocket</title>
<!-- Library Chart.js untuk Grafik Real-Time -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh; padding: 20px; color: #333;
}
.container { max-width: 1000px; margin: 0 auto; }
h1 { color: white; text-align: center; margin-bottom: 25px; font-size: 28px; }

/* Banner Peringatan Suhu Melewati Threshold */
.alert-banner {
    display: none;
    background: #dc3545;
    color: white;
    padding: 15px 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    font-weight: bold;
    text-align: center;
    box-shadow: 0 5px 20px rgba(220, 53, 69, 0.4);
    animation: pulse 1.5s infinite;
}
@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.75; }
    100% { opacity: 1; }
}

.cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px; margin-bottom: 25px;
}
.card {
    background: white; border-radius: 15px; padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center; transition: transform 0.2s;
}
.card:hover { transform: translateY(-5px); }
.card .label { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
.card .value { font-size: 42px; font-weight: bold; margin: 10px 0; color: #667eea; }
.card .unit { font-size: 18px; color: #aaa; }

.status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
.status-online { background: #d4edda; color: #155724; }
.status-offline { background: #f8d7da; color: #721c24; }

.panel {
    background: white; border-radius: 15px; padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 25px;
}
.panel h2 { font-size: 18px; margin-bottom: 15px; color: #444; }
.controls { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }

.btn {
    padding: 12px 30px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: all 0.2s;
}
.btn-on { background: #28a745; color: white; }
.btn-on:hover { background: #218838; }
.btn-off { background: #dc3545; color: white; }
.btn-off:hover { background: #c82333; }
.btn-primary { background: #667eea; color: white; }
.btn-primary:hover { background: #5a6fd6; }

.input-threshold {
    padding: 11px 15px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    width: 140px;
    outline: none;
}
.input-threshold:focus { border-color: #667eea; }

table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
th { background: #f8f9fa; color: #666; text-transform: uppercase; font-size: 12px; }
tr:hover td { background: #f9f9f9; }

#log {
    background: #1e1e1e; color: #0f0; font-family: monospace;
    padding: 15px; border-radius: 10px; max-height: 180px;
    overflow-y: auto; font-size: 13px; line-height: 1.6;
}
#log .error { color: #f66; }
#log .info { color: #6af; }
#log .warn { color: #fc3; }
</style>
</head>
<body>
<div class="container">
    <h1>IoT Dashboard — WebSocket, Chart.js & REST API</h1>

    <!-- Banner Notifikasi Threshold -->
    <div id="alert-banner" class="alert-banner"></div>

    <!-- Kartu Sensor -->
    <div class="cards">
        <div class="card">
            <div class="label">Suhu</div>
            <div class="value" id="suhu">--</div>
            <div class="unit">°C</div>
        </div>
        <div class="card">
            <div class="label">Kelembaban</div>
            <div class="value" id="kelembaban">--</div>
            <div class="unit">%</div>
        </div>
        <div class="card">
            <div class="label">Status Koneksi</div>
            <div class="value" style="font-size:22px;" id="status">
                <span class="status-badge status-offline" id="status-badge">OFFLINE</span>
            </div>
            <div class="unit" style="font-size:13px;">Batas Suhu: <strong id="current-threshold">30</strong> °C</div>
        </div>
    </div>

    <!-- Grafik Real-Time (Chart.js) -->
    <div class="panel">
        <h2>Grafik Real-Time Suhu & Kelembaban</h2>
        <canvas id="sensorChart" height="90"></canvas>
    </div>

    <!-- Kontrol Perangkat & Pengaturan Threshold -->
    <div class="cards" style="margin-bottom: 0;">
        <div class="panel">
            <h2>Kontrol Perangkat</h2>
            <div class="controls">
                <button class="btn btn-on" onclick="kontrol('lamp','on')">Nyalakan Lampu</button>
                <button class="btn btn-off" onclick="kontrol('lamp','off')">Matikan Lampu</button>
            </div>
        </div>
        <div class="panel">
            <h2>Set Batas Suhu (PUT /api/threshold)</h2>
            <div class="controls">
                <input type="number" id="input-threshold" class="input-threshold" step="0.5" value="30" placeholder="Batas °C">
                <button class="btn btn-primary" onclick="setThreshold()">Simpan Batas</button>
            </div>
        </div>
    </div>

    <!-- History dari SQLite -->
    <div class="panel">
        <h2>10 Data Sensor Terakhir (SQLite)</h2>
        <table>
            <thead>
                <tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembaban (%)</th></tr>
            </thead>
            <tbody id="history-body">
                <tr><td colspan="3" style="text-align:center;color:#999;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Log -->
    <div class="panel">
        <h2>Log Aktivitas</h2>
        <div id="log"></div>
    </div>
</div>

<script>
// ==============================
// KONFIGURASI API & WEBSOCKET
// ==============================
const HOST = window.location.hostname || 'localhost';
const API_BASE = window.location.origin + '/api';
const WS_URL = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws/sensor';
const API_KEY = 'rahasia123';

// ==============================
// UTILITY: LOG
// ==============================
function log(msg, type = 'info') {
    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString();
    el.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
    el.scrollTop = el.scrollHeight;
}

// ==============================
// INISIALISASI CHART.JS
// ==============================
const ctx = document.getElementById('sensorChart').getContext('2d');
const sensorChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [
            {
                label: 'Suhu (°C)',
                data: [],
                borderColor: '#667eea',
                backgroundColor: 'rgba(102, 126, 234, 0.15)',
                tension: 0.3,
                fill: true
            },
            {
                label: 'Kelembaban (%)',
                data: [],
                borderColor: '#28a745',
                backgroundColor: 'rgba(40, 167, 69, 0.15)',
                tension: 0.3,
                fill: true
            }
        ]
    },
    options: {
        responsive: true,
        scales: { y: { beginAtZero: false } }
    }
});

function updateChart(waktu, suhu, kelembaban) {
    const labelTime = new Date(waktu).toLocaleTimeString();
    if (sensorChart.data.labels.length >= 15) {
        sensorChart.data.labels.shift();
        sensorChart.data.datasets[0].data.shift();
        sensorChart.data.datasets[1].data.shift();
    }
    sensorChart.data.labels.push(labelTime);
    sensorChart.data.datasets[0].data.push(suhu);
    sensorChart.data.datasets[1].data.push(kelembaban);
    sensorChart.update();
}

// ==============================
// KONEKSI WEBSOCKET REAL-TIME (TANPA POLLING)
// ==============================
function connectWebSocket() {
    const ws = new WebSocket(WS_URL);
    const badge = document.getElementById('status-badge');

    ws.onopen = () => {
        badge.textContent = 'ONLINE (WS)';
        badge.className = 'status-badge status-online';
        log('✓ Terhubung ke WebSocket Node-RED (/ws/sensor)', 'info');
        fetchHistory();
    };

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        document.getElementById('suhu').textContent = data.suhu;
        document.getElementById('kelembaban').textContent = data.kelembaban;
        if (data.threshold !== undefined) {
            document.getElementById('current-threshold').textContent = data.threshold;
        }

        updateChart(data.received || data.timestamp, data.suhu, data.kelembaban);
        fetchHistory();

        // Tampilkan atau sembunyikan notifikasi batas suhu
        const banner = document.getElementById('alert-banner');
        if (data.alert) {
            banner.style.display = 'block';
            banner.textContent = data.alert_message;
            log(`⚠ ${data.alert_message}`, 'warn');
        } else {
            banner.style.display = 'none';
        }
    };

    ws.onclose = () => {
        badge.textContent = 'OFFLINE';
        badge.className = 'status-badge status-offline';
        log('✗ Koneksi WebSocket terputus, menyambungkan ulang dalam 3 detik...', 'error');
        setTimeout(connectWebSocket, 3000);
    };
}

// ==============================
// FETCH HISTORY DARI SQLITE (GET + X-API-Key)
// ==============================
async function fetchHistory() {
    try {
        const res = await fetch(`${API_BASE}/history`, {
            headers: { 'X-API-Key': API_KEY }
        });
        const json = await res.json();
        const tbody = document.getElementById('history-body');
        if (!json.data || json.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;">Belum ada data</td></tr>';
            return;
        }
        
        // Tampilkan di tabel (terbaru di atas)
        tbody.innerHTML = json.data.map(d => `
            <tr>
                <td>${new Date(d.received || d.timestamp).toLocaleTimeString()}</td>
                <td>${d.suhu}</td>
                <td>${d.kelembaban}</td>
            </tr>
        `).join('');

        // Jika grafik masih kosong/kurang dari 2 titik, isi dari 10 data terakhir (urut lama ke baru)
        if (sensorChart.data.labels.length <= 1) {
            const urutLamaKeBaru = [...json.data].reverse();
            sensorChart.data.labels = urutLamaKeBaru.map(d => new Date(d.received || d.timestamp).toLocaleTimeString());
            sensorChart.data.datasets[0].data = urutLamaKeBaru.map(d => d.suhu);
            sensorChart.data.datasets[1].data = urutLamaKeBaru.map(d => d.kelembaban);
            sensorChart.update();
        }
    } catch (err) {
        log(`Gagal fetch history: ${err.message}`, 'error');
    }
}

// ==============================
// SET BATAS THRESHOLD (PUT + X-API-Key)
// ==============================
async function setThreshold() {
    const val = parseFloat(document.getElementById('input-threshold').value);
    try {
        const res = await fetch(`${API_BASE}/threshold`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-API-Key': API_KEY
            },
            body: JSON.stringify({ threshold: val })
        });
        const json = await res.json();
        if (json.status === 'success') {
            document.getElementById('current-threshold').textContent = json.threshold;
            log(`✓ ${json.message}`, 'info');
        } else {
            log(`✗ Gagal set threshold: ${json.message}`, 'error');
        }
    } catch (err) {
        log(`✗ Error threshold: ${err.message}`, 'error');
    }
}

// ==============================
// KONTROL LAMPU (POST + X-API-Key)
// ==============================
async function kontrol(device, action) {
    try {
        const res = await fetch(`${API_BASE}/kontrol`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-API-Key': API_KEY
            },
            body: JSON.stringify({ device, action })
        });
        const json = await res.json();
        if (json.status === 'success') {
            log(`✓ Perintah terkirim: ${device} → ${action}`, 'info');
        } else {
            log(`✗ Gagal: ${json.message}`, 'error');
        }
    } catch (err) {
        log(`✗ Error kontrol: ${err.message}`, 'error');
    }
}

// ==============================
// MULAI WEBSOCKET
// ==============================
async function fetchSensor() {
    try {
        const res = await fetch(`${API_BASE}/suhu`, {
            headers: { 'X-API-Key': API_KEY }
        });
        const json = await res.json();
        if (json.status === 'success' && json.data && json.data.suhu !== null) {
            document.getElementById('suhu').textContent = json.data.suhu;
            document.getElementById('kelembaban').textContent = json.data.kelembaban;
            document.getElementById('current-threshold').textContent = json.threshold || 30;
            updateChart(json.data.received || json.data.timestamp, json.data.suhu, json.data.kelembaban);
        }
    } catch (err) {
        log(`Gagal fetch awal: ${err.message}`, 'error');
    }
}

log('Dashboard dimulai, menghubungkan ke WebSocket...');
fetchSensor();
fetchHistory();
connectWebSocket();
</script>
</body>
</html>
